version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: trek

build:
  toolchains: []
  run_buildscript: false

images:
  - id: trek
    target: service
    service: trek-app
    source: mauriceboe/trek
    channel: stable
    delivery:
      mode: mirror

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: TREK
    summary: "Published from lazycat-contrib/trek-lzcapp"
